name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without a leading v; defaults to packageVersion
        required: false
        type: string

permissions: {}

cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release-guard
      deployment: false
    steps:
      - run: echo "release guard passed"

  package:
    needs: release-guard
    runs-on: macos-26
    environment:
      name: release-signing
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SwiftPM dependency cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-macos-26-
          lookup-only: true

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          : "${SIGNING_IDENTITY:?Missing APPLE_CODESIGN_IDENTITY}"
          keychain="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          security find-identity -v -p codesigning "${keychain}"
          echo "CODESIGN_IDENTITY=${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Configure App Store Connect notary key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID_SECRET: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID_SECRET: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${NOTARY_KEY_BASE64:?Missing APPLE_NOTARY_PRIVATE_KEY_BASE64}"
          : "${NOTARY_KEY_ID_SECRET:?Missing APPLE_NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID_SECRET:?Missing APPLE_NOTARY_ISSUER_ID}"
          notary_key="${RUNNER_TEMP}/notary-api-key.p8"
          printf '%s' "${NOTARY_KEY_BASE64}" | base64 --decode > "${notary_key}"
          chmod 600 "${notary_key}"
          echo "NOTARY_KEY_PATH=${notary_key}" >> "${GITHUB_ENV}"
          echo "NOTARY_KEY_ID=${NOTARY_KEY_ID_SECRET}" >> "${GITHUB_ENV}"
          echo "NOTARY_ISSUER_ID=${NOTARY_ISSUER_ID_SECRET}" >> "${GITHUB_ENV}"

      - name: Package, sign, and notarize release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NOTARIZE_RELEASE: "1"
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          ./scripts/package-release.sh "${version}" dist

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imessage-relay-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          security delete-keychain "${RUNNER_TEMP}/release-signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/notary-api-key.p8"

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imessage-relay-release-assets
          path: dist

      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: luxass
          repositories: imessage-relay
          permission-contents: write

      # GITHUB_TOKEN cannot trigger the release: published Homebrew workflow.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
