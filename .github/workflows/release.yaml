name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without a leading v; defaults to packageVersion
        required: false
        type: string

permissions: {}
cache-mode: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: release-guard
      deployment: false
    steps:
      - run: echo "release guard passed"

  package:
    needs: release-guard
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-macos-26-

      - name: Package release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          ./scripts/package-release.sh "${version}" dist

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imessage-relay-server-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imessage-relay-server-release-assets
          path: dist

      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: luxass
          repositories: imessage-relay
          permission-contents: write

      # GITHUB_TOKEN cannot trigger the release: published Homebrew workflow.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
