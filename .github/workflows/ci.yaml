name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SWIFTLINT_VERSION: "0.65.1"
  # sha256 of portable_swiftlint.zip in the ${SWIFTLINT_VERSION} release.
  # Bump both together; verify with:
  #   curl -fsSL "https://api.github.com/repos/realm/SwiftLint/releases/tags/${SWIFTLINT_VERSION}" | jq -r '.assets[] | select(.name=="portable_swiftlint.zip") | .digest'
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: just

      - name: macOS version
        run: sw_vers
      - name: Swift version
        id: swift
        run: |
          swift --version
          # Compiled modules only work with the compiler that built them, so the cache key includes it.
          echo "fingerprint=$(swift --version 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Leave cache-mode unset so GitHub's trigger-based protection applies:
      # trusted pushes can refresh the cache without granting that access to PRs.
      # The release workflow never restores this cache and always builds from source.
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: swiftpm-build-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ steps.swift.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-build-${{ runner.os }}-${{ runner.arch }}-macos-26-${{ steps.swift.outputs.fingerprint }}-

      - name: Check Swift version
        run: just check-toolchain

      - name: Verify resolved dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Install SwiftLint
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            -o /tmp/swiftlint.zip
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 --check --status
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install -m 0755 /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Build
        run: just build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile
      - name: Check documentation
        run: pnpm check
      - name: Build documentation from the committed artifact
        run: pnpm build
