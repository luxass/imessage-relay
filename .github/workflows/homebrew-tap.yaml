name: Update Homebrew Tap

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: homebrew-tap-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  update-formula:
    if: ${{ !github.event.release.prerelease }}
    permissions:
      contents: write
      pull-requests: write
    uses: luxass/shared-workflows/.github/workflows/reusable-homebrew-tap.yaml@7be4a924607be148a2093d4651d920cfcc9a264f # v0.13.0
    with:
      tap-repository: luxass/homebrew-tap
      formula-path: Formula/imessage-relay-server.rb
      formula-name: imessage-relay-server
      environment: homebrew-tap
      targets: '["macos-universal"]'
      cask-path: Casks/imessage-relay.rb
      cask-name: imessage-relay
      cask-target: macos-universal
    secrets:
      # Reusable workflow jobs cannot set an environment in the caller. Pass
      # these repository secrets explicitly; the called job uses homebrew-tap.
      app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
      app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
