name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    permissions:
      # read workflow runs and history
      actions: read
      # checkout repository contents
      contents: read
      # upload SARIF results to GitHub Security tab
      security-events: write
      # OIDC token for GitHub API authentication
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-ci-security.yaml@7be4a924607be148a2093d4651d920cfcc9a264f # v0.13.0
