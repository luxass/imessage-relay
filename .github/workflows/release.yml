name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package without a leading v; defaults to packageVersion
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just

      - name: macOS version
        run: sw_vers
      - name: Swift version
        run: swift --version
      - name: Check Swift version
        run: just check-toolchain

      - name: Install SwiftLint
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            -o /tmp/swiftlint.zip
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 --check --status
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install -m 0755 /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint

      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Package release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          ./scripts/package-release.sh "${version}" dist

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-server-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: relay-server-release-assets
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/relay-server-macos-universal.tar.gz"
          checksum="${archive}.sha256"
          (cd dist && shasum -a 256 --check "$(basename "${checksum}")")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" "${checksum}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" "${checksum}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
